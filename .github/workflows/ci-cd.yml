name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src tests

      - name: Run ruff format check
        run: ruff format --check src tests

      - name: Run mypy
        run: mypy src

      - name: Run tests
        run: pytest tests -q --tb=short --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

  build-windows:
    needs: lint-and-test
    runs-on: windows-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Build executable
        run: |
          pyinstaller genshin-code-monitor.spec --clean

      - name: Build Inno Setup installer
        run: |
          $ver = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $isscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isscc)) { $isscc = (Get-Command ISCC.exe -ErrorAction Stop).Source }
          & $isscc "/DMYAPPVERSION=$ver" installer.iss

      - name: Smoke test installer
        run: |
          & "dist\hoyo-code-monitor\hoyo-code-monitor.exe" --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ver = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $setup = "hoyo-code-monitor-$ver-setup.exe"
          if (-not (Test-Path $setup)) {
            Write-Host "Installer not found in CWD. Searching..."
            Get-ChildItem -Recurse -Filter "$setup" -Path . | Select-Object -First 5
            exit 1
          }
          if ((Get-Item $setup).Length -le 5MB) { exit 1 }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hoyo-code-monitor-windows
          path: |
            dist/hoyo-code-monitor/*.exe
            *.exe
          retention-days: 30

      - name: Create release assets
        if: github.event_name == 'release'
        run: |
          echo "RELEASE_ASSETS=hoyo-code-monitor-${{ github.event.release.tag_name }}-setup.exe" >> $GITHUB_ENV

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            hoyo-code-monitor-${{ github.event.release.tag_name }}-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  draft-release-on-tag:
    needs: [lint-and-test, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: hoyo-code-monitor-windows
          path: release

      - name: Create draft release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/dist/hoyo-code-monitor/*.exe
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'release' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max