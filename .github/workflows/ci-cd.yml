name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src tests

      - name: Run ruff format check
        run: ruff format --check src tests

      - name: Run mypy
        run: mypy src

      - name: Run tests
        run: pytest tests -q --tb=short --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

  build-windows:
    needs: lint-and-test
    runs-on: windows-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Build executable
        run: |
          pyinstaller genshin-code-monitor.spec --clean

      - name: Build Inno Setup installer
        shell: powershell
        run: |
          $ver = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          # Inno Setup ships on the GitHub-hosted windows runner image. Try the
          # standard install paths, then PATH, in that order.
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) { Write-Error "ISCC.exe (Inno Setup compiler) not found on this runner"; exit 1 }
          & $iscc "/DMyAppVersion=$ver" installer.iss

      - name: Smoke test installer
        shell: powershell
        run: |
          & "dist\hoyo-code-monitor\hoyo-code-monitor.exe" --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ver = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          # Inno Setup now writes its output to 'out\hoyo-code-monitor-<ver>-setup.exe'
          # (OutputDir=out in installer.iss) so the artifact is always co-located
          # with the rest of the build tree in the runner workdir.
          $setup = "out\hoyo-code-monitor-$ver-setup.exe"
          if (-not (Test-Path $setup)) {
            Write-Host "Installer not found. Searching..."
            Get-ChildItem -Recurse -Filter "hoyo-code-monitor-*setup.exe" -Path . | Select-Object -First 5
            exit 1
          }
          if ((Get-Item $setup).Length -le 5MB) { exit 1 }
          Write-Host "Smoke test passed: $setup"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hoyo-code-monitor-windows
          path: |
            dist/hoyo-code-monitor/*.exe
            out/*.exe
          retention-days: 30

      - name: Create release assets
        if: github.event_name == 'release'
        run: |
          echo "RELEASE_ASSETS=out/hoyo-code-monitor-${{ github.event.release.tag_name }}-setup.exe" >> $GITHUB_ENV

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            out/hoyo-code-monitor-${{ github.event.release.tag_name }}-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  draft-release-on-tag:
    needs: [lint-and-test, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: hoyo-code-monitor-windows
          path: release

      - name: Create draft release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/dist/hoyo-code-monitor/*.exe
            release/out/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'release' }}
          # On non-release pushes (main/dev) tag_name is empty, so the second
          # tag would be "ghcr.io/<repo>:" — an invalid reference. Only emit it
          # when we're actually on a release.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ${{ github.event_name == 'release' && format('ghcr.io/{0}:{1}', github.repository, github.event.release.tag_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max