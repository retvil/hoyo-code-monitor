name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src tests

      - name: Run ruff format check
        run: ruff format --check src tests

      - name: Run mypy
        run: mypy src

      - name: Run tests
        run: pytest tests -q --tb=short --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

  build-windows:
    needs: lint-and-test
    runs-on: windows-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Build executable
        run: |
          pyinstaller genshin-code-monitor.spec --clean

      - name: Build Inno Setup installer
        shell: powershell
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $ver = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) { Write-Error "ISCC.exe (Inno Setup compiler) not found on this runner"; exit 1 }
          & $iscc "/DMyAppVersion=$ver" installer.iss
          # ISCC writes to 'out/' relative to GITHUB_WORKSPACE (its CWD).
          # Copy the installer to GITHUB_WORKSPACE root for the smoke test.
          $target = Join-Path $env:GITHUB_WORKSPACE "hoyo-code-monitor-$ver-setup.exe"
          $found = Get-ChildItem -Recurse -Filter "hoyo-code-monitor-$ver-setup.exe" -Path $env:GITHUB_WORKSPACE -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) { Write-Error "Inno installer not found after compile"; exit 1 }
          Copy-Item $found.FullName $target -Force
          Write-Host "Installer ready: $target"

      - name: Smoke test installer
        shell: powershell
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $ver = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $name = "hoyo-code-monitor-$ver-setup.exe"
          # The Inno build step copies the installer to GITHUB_WORKSPACE root.
          # Also check out/ (ISCC's original output dir) as a fallback.
          $candidates = @("$env:GITHUB_WORKSPACE\out\$name", "$env:GITHUB_WORKSPACE\$name")
          $setupPath = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) { $setupPath = $c; break }
          }
          if (-not $setupPath) {
            Write-Host "ERROR: $name not found in out/ or GITHUB_WORKSPACE root."
            Write-Host "GITHUB_WORKSPACE = $env:GITHUB_WORKSPACE"
            exit 1
          }
          $size = (Get-Item $setupPath).Length
          if ($size -le 5MB) {
            Write-Host "ERROR: $setupPath is only $([math]::Round($size / 1048576, 2)) MB. Build likely failed."
            exit 1
          }
          Write-Host "Smoke test passed: $setupPath ($([math]::Round($size / 1048576, 2)) MB)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: hoyo-code-monitor-windows
          path: |
            dist/hoyo-code-monitor/*.exe
            out/*.exe
            hoyo-code-monitor-*setup.exe
          retention-days: 30

      - name: Create release assets
        if: github.event_name == 'release'
        run: |
          echo "RELEASE_ASSETS=hoyo-code-monitor-${{ github.event.release.tag_name }}-setup.exe" >> $GITHUB_ENV

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hoyo-code-monitor-${{ github.event.release.tag_name }}-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  draft-release-on-tag:
    needs: [lint-and-test, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: hoyo-code-monitor-windows
          path: release

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/dist/hoyo-code-monitor/*.exe
            release/out/*.exe
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'release' }}
          # On non-release pushes (main/dev) tag_name is empty, so the second
          # tag would be "ghcr.io/<repo>:" (an invalid reference). Only emit it
          # when we're actually on a release.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ${{ github.event_name == 'release' && format('ghcr.io/{0}:{1}', github.repository, github.event.release.tag_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max