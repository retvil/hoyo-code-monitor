version: '3.8'

services:
  hoyo-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoyo-code-monitor
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - CONFIG_PATH=/app/config/config.toml
      - DB_PATH=/app/data/monitor.db
      - LOG_FILE=/app/logs/app.log
    # Uncomment to enable web UI when implemented
    # ports:
    #   - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Add a separate service for manual commands
  genshin-cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoyo-code-monitor-cli
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - CONFIG_PATH=/app/config/config.toml
      - DB_PATH=/app/data/monitor.db
      - LOG_FILE=/app/logs/app.log
    entrypoint: ["hoyo-code-monitor"]
    command: ["--help"]
    profiles:
      - cli