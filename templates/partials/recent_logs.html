<div class="card-title" style="margin-bottom: 12px;">Redemption log</div>
{% if logs %}
<div style="max-height: 300px; overflow-y: auto;">
    {% for log in logs %}
    <div class="mono" style="font-size: 0.85rem; padding: 6px 10px; background: var(--bg); border-radius: 6px; margin-bottom: 4px;">
        <strong>{{ log.code[:4] }}****</strong> | {{ log.status | upper }} | {{ log.reward or '-' }} | {{ log.attempted_at[:19] }}{% if log.error_message %} | {{ log.error_message }}{% endif %}
    </div>
    {% endfor %}
</div>
{% else %}
<p class="muted">No redemption logs yet.</p>
{% endif %}
