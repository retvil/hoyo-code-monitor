<div class="card-title" style="margin-bottom: 12px;">Statistics</div>
<div class="kpi-grid">
    <div class="kpi"><div style="font-size: 1.8rem; font-weight: 700;">{{ stats.total_codes }}</div><div class="muted" style="font-size: 0.85rem;">Total codes</div></div>
    <div class="kpi good"><div style="font-size: 1.8rem; font-weight: 700;">{{ stats.successful }}</div><div class="muted" style="font-size: 0.85rem;">Redeemed</div></div>
    <div class="kpi bad"><div style="font-size: 1.8rem; font-weight: 700;">{{ stats.failed }}</div><div class="muted" style="font-size: 0.85rem;">Pending</div></div>
</div>
{% if stats.by_source %}
<h4 style="margin: 16px 0 8px; font-size: 0.9rem;">By source</h4>
<table>
    <thead><tr><th>Source</th><th style="text-align: right;">Codes</th></tr></thead>
    <tbody>{% for source, count in stats.by_source.items() %}<tr><td>{{ source }}</td><td style="text-align: right;">{{ count }}</td></tr>{% endfor %}</tbody>
</table>
{% endif %}
