[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hoyo-code-monitor"
version = "0.1.0"
description = "Local Windows app to monitor and redeem Genshin Impact promo codes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Genshin Code Monitor Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = [
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "click>=8.1.0",
    "apscheduler>=3.10.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0; python_version < '3.11'",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    "playwright>=1.40.0",
    "psutil>=5.9.0",
    "portalocker>=2.8.0",
    "colorlog>=6.8.0",
    "lxml>=5.0.0",
    "prometheus-client>=0.19.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.0",
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "responses>=0.25.0",
    "aioresponses>=0.7.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-toml>=0.10.0",
    "pytest-cov>=4.1.0",
]
web = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.0",
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
]

[project.scripts]
hoyo-code-monitor = "src.cli:cli"
hoyo-code-monitor-web = "src.web_ui:main"
hoyo-code-monitor-scheduler = "src.scheduler:main"

[project.urls]
Homepage = "https://github.com/retvil/hoyo-code-monitor"
Repository = "https://github.com/retvil/hoyo-code-monitor"
Issues = "https://github.com/retvil/hoyo-code-monitor/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["templates/*.html", "*.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4", "C9", "N", "T20", "W", "PT", "PTH", "ERA", "SIM", "PD", "RUF", "TRY", "RET", "ARG", "PL", "TCH", "PYI"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint]
per-file-ignores = { "tests/*" = ["S101", "S106"] }

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
explicit_package_bases = true
ignore_missing_imports = true

[tool.mypy.plugins]
pydantic = "pydantic.mypy"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/web_ui.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pyinstaller]
hidden-imports = [
    "cryptography",
    "keyring",
    "playwright",
    "psutil",
    "portalocker",
    "prometheus_client",
    "fastapi",
    "uvicorn",
    "jinja2",
    "pydantic",
    "httpx",
    "apscheduler",
    "colorlog",
    "lxml",
    "bs4",
    "tomli",
    "tomli_w",
]
collect-data-files = [
    "templates/*",
    "config.toml",
]
exclude-modules = [
    "tkinter",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "PIL",
    "cv2",
]